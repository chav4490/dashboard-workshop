<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world</title>
    <link rel="icon" href="design-system/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <link rel="stylesheet" href="design-system/tokens.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: calc(var(--spacing-unit) * 2);
        box-sizing: border-box;
      }

      main {
        max-width: 32rem;
        padding: calc(var(--spacing-unit) * 4);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        background: var(--color-surface);
        text-align: center;
      }

      h1 {
        margin: calc(var(--spacing-unit) * 2) 0 var(--spacing-unit);
        font: var(--text-page-title);
      }

      h1 span {
        color: var(--color-accent);
      }

      p {
        margin: 0;
        color: var(--color-text-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="design-system/logo.svg" alt="" width="48" height="48" />
      <h1>Hello, <span>world</span>!</h1>
      <p>The workshop repo is cloned and this page is rendering.</p>
    </main>
  </body>
</html>
